name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Tests
        run: ./run.sh test
      - name: Smoke-run the simulator
        run: ./run.sh simulate --play basic,random --bet flat,hilo --sims 50 --hands 2000 --out /tmp/results
